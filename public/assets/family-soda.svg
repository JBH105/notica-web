.spark{animation:sp 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sp{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(25deg);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
